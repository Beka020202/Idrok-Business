name: Build Android APK

on:
  push:
    branches: [main, ccr-0ad9ecbe-bgb88t]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../idrok-business.apk

      - uses: actions/upload-artifact@v4
        with:
          name: idrok-business-apk
          path: idrok-business.apk

      - name: Publish to "Latest APK" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Idrok Business — latest APK
          body: |
            Download **idrok-business.apk** below, open it on your Android phone and allow "Install unknown apps".
            Built from ${{ github.ref_name }} @ ${{ github.sha }}. Demo data only.
          prerelease: true
          files: idrok-business.apk
